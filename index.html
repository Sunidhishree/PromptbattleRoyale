<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Battle Royale</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/prompt.css">
</head>

<body class="pbr">
    <div class="top-nav">
        <button class="px-btn ghost" id="mute-btn" aria-label="Toggle music">♪ ON</button>
    </div>

    <div class="landing-container">
        <div class="logo-container">
            <h1 class="pbr-logo">
                <span class="l1">PROMPT</span>
                <span class="l2">BATTLE</span>
                <span class="l3">ROYALE</span>
            </h1>
        </div>
        <p class="pbr-tagline">Two prompts enter. One prompt leaves.</p>

        <button class="play-btn" id="play-btn" aria-label="Play">
            <img src="assets/images/button/play.png" alt="Play" class="play-icon">
        </button>
        <p class="press-start">PRESS PLAY</p>

        <div class="bottom-arena-container">
            <img src="assets/images/arena/bunny jumping STICKER.gif" alt="" class="bunny-sticker">
            <img src="assets/images/arena/arena.png" alt="" class="arena-bottom">
        </div>
    </div>

    <script src="js/sfx.js"></script>
    <script>
        SFX.bindMuteButton(document.getElementById('mute-btn'));
        SFX.startMusic('start', 0.55);
        document.getElementById('play-btn').addEventListener('click', () => {
            setTimeout(() => { window.location.href = 'prompt-select.html'; }, 180);
        });
    </script>
</body>

</html>
